<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="FileBox">
  <title>FileBox</title>
  <defs>
    <!-- 底色：与 index.html 的 --brand 同族，左上亮、右下沉 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6ef4"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3b31c4"/>
    </linearGradient>
    <!-- 左上角柔光，避免大面积纯渐变发闷 -->
    <radialGradient id="glow" cx="0.26" cy="0.1" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1660" flood-opacity="0.28"/>
    </filter>
    <filter id="dropSm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b1660" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 底色全出血：iOS 自己裁圆角，所以四角不留透明 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 文件卡片：右上折角 -->
  <g filter="url(#drop)">
    <path d="M288 296a72 72 0 0 1 72-72h228l148 148v356a72 72 0 0 1-72 72H360a72 72 0 0 1-72-72z" fill="#ffffff"/>
  </g>
  <!-- 折页：比纸面暗一档，暗示"这是被折过来的" -->
  <path d="M588 224l148 148H588z" fill="#4f46e5" fill-opacity="0.16"/>
  <!-- 三行文字骨架，末行短一截才像文档 -->
  <g fill="#4f46e5" fill-opacity="0.17">
    <rect x="384" y="404" width="256" height="28" rx="14"/>
    <rect x="384" y="498" width="256" height="28" rx="14"/>
    <rect x="384" y="592" width="152" height="28" rx="14"/>
  </g>

  <!-- 右下角徽章：分享/上传箭头，白底把箭头从纸面里"拎"出来 -->
  <g filter="url(#dropSm)">
    <circle cx="800" cy="800" r="150" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#4338ca" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 862V740"/>
    <path d="M754 786l46-46 46 46"/>
  </g>
</svg>
